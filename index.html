<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<title>BATTLE RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-logo">BATTLE<br><span>RUSH</span></div>
    <div class="tag">ENTER THE BATTLEFIELD</div>
    <div class="loader"></div>
  </div>
</div>

<div id="auth" class="auth-screen hidden">
  <div class="auth-box">
    <div class="logo-big">BATTLE<br><span>RUSH</span></div>
    <div class="tag">ENTER THE BATTLEFIELD</div>
    <div class="auth-card">
      <div id="loginForm">
        <h2>Welcome Back</h2>
        <p class="muted">Login to your tournament account.</p>
        <div class="field"><label>Mobile / Email</label><input id="loginId" placeholder="Enter mobile or email"></div>
        <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Enter password"></div>
        <div id="loginErr" class="error"></div>
        <button class="btn primary" style="width:100%" onclick="login()">LOGIN</button>
        <p class="switch">Don't have an account? <span class="link" onclick="showSignup()">Sign Up</span></p>
      </div>
      <div id="signupForm" class="hidden">
        <h2>Create Account</h2>
        <p class="muted">Join the gaming arena.</p>
        <div class="field"><label>Full Name</label><input id="regName" placeholder="Enter full name"></div>
        <div class="field"><label>Mobile / Email</label><input id="regId" placeholder="Enter mobile or email"></div>
        <div class="field"><label>In-Game Name (IGN)</label><input id="regIgn" placeholder="Free Fire Username"></div>
        <div class="field"><label>Password</label><input id="regPass" type="password" placeholder="Create password"></div>
        <div id="signupErr" class="error"></div>
        <button class="btn primary" style="width:100%" onclick="signup()">SIGN UP</button>
        <p class="switch">Already registered? <span class="link" onclick="showLogin()">Login</span></p>
      </div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <main class="container">
    <header class="topbar">
      <div class="brand">BATTLE <span>RUSH</span></div>
      <div class="top-actions">
        <button class="icon" onclick="navigate('notifications')">🔔<i id="notifyDot" class="notify-dot"></i></button>
        <button class="avatar" onclick="navigate('profile')" id="topAvatar">BR</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <nav class="bottom">
    <button class="nav active" data-nav="home" onclick="navigate('home')"><span class="ico">⌂</span>HOME</button>
    <button class="nav" data-nav="tournaments" onclick="navigate('tournaments')"><span class="ico">⚔</span>MATCHES</button>
    <button class="nav" data-nav="mygames" onclick="navigate('mygames')"><span class="ico">🎮</span>MY GAMES</button>
    <button class="nav" data-nav="wallet" onclick="navigate('wallet')"><span class="ico">💰</span>WALLET</button>
    <button class="nav" data-nav="profile" onclick="navigate('profile')"><span class="ico">●</span>PROFILE</button>
  </nav>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div id="modalContent" class="modal-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
